services:
  backend:
    build:
      context: ./backend
    environment:
      MEDIMG_DB_PATH: /app/data/app.db
      MEDIMG_MODEL_PATH: /app/model/model.onnx
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./model/artifacts:/app/model
    networks:
      - medimg-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  openclaw:
    image: alpine/openclaw
    environment:
      BACKEND_URL: http://backend:8000
      OLLAMA_BASE_URL: http://ollama:11434
      OPENCLAW_CONFIG_PATH: /skills/openclaw.json
    ports:
      - "18789:18789"
    volumes:
      - ./agent:/skills
      - openclaw_state:/home/node/.openclaw
    networks:
      - medimg-net
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - medimg-net

networks:
  medimg-net:
    driver: bridge

volumes:
  ollama_data:
  openclaw_state:
