services:
  backend:
    build:
      context: ./backend
    environment:
      MEDIMG_DB_PATH: /app/data/app.db
      MEDIMG_MODEL_PATH: /app/model/model.onnx
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./model/artifacts:/app/model
    networks:
      - medimg-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - medimg-net

networks:
  medimg-net:
    driver: bridge

volumes:
  ollama_data:
