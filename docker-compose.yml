services:
  backend:
    build:
      context: ./backend
    environment:
      MEDIMG_DB_PATH: /app/data/app.db
      MEDIMG_MODEL_PATH: /app/model/model.onnx
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./model/artifacts:/app/model
    networks:
      - medimg-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Messaging agent — uncomment and set the correct image + tokens when ready.
  # agent:
  #   image: YOUR_AGENT_IMAGE_HERE
  #   environment:
  #     BACKEND_URL: http://backend:8000
  #     SKILL_PATH: /skills/SKILL.md
  #     TELEGRAM_TOKEN: your_token_here
  #     # WHATSAPP_TOKEN: your_token_here
  #   volumes:
  #     - ./agent:/skills
  #   networks:
  #     - medimg-net
  #   depends_on:
  #     backend:
  #       condition: service_healthy

networks:
  medimg-net:
    driver: bridge
